# Nginx vhost for IndiaOffers E-Mystery — https://mystery.indiaoffers.in
#
#   1. DNS:    A  mystery  →  <your VPS IP>   (zone: indiaoffers.in)
#   2. Copy:   sudo cp deploy/nginx-mystery.indiaoffers.in.conf \
#                     /etc/nginx/sites-available/mystery.indiaoffers.in
#   3. Enable: sudo ln -s /etc/nginx/sites-available/mystery.indiaoffers.in \
#                         /etc/nginx/sites-enabled/
#   4. Test:   sudo nginx -t && sudo systemctl reload nginx
#   5. TLS:    sudo certbot --nginx -d mystery.indiaoffers.in
#
# Certbot rewrites this file to add the 443 block and the http→https redirect.

# Rate limit zones (defined once; move to http{} in nginx.conf if this vhost
# is not the only one that needs them).
limit_req_zone $binary_remote_addr zone=emystery_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=emystery_login:10m   rate=1r/s;

upstream emystery_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mystery.indiaoffers.in;

    # Certbot replaces this with a redirect to https once the cert is issued.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Order/pay/report URLs carry a private access token in ?t=. Log the path
    # without the query string so a working credential never lands on disk.
    # (The app redacts it in its own logs too.)
    log_format emystery '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/mystery.indiaoffers.in.access.log emystery;
    error_log  /var/log/nginx/mystery.indiaoffers.in.error.log;

    # Payment-proof uploads (5 MB cap in the app) plus headroom.
    client_max_body_size 8m;
    client_body_timeout 30s;

    # Don't advertise the nginx version.
    server_tokens off;

    # Health endpoint: allow monitoring, keep it out of the access log.
    location = /healthz {
        proxy_pass http://emystery_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Admin login: throttle credential stuffing before it reaches Node.
    # (The app also rate-limits; this is the cheaper outer layer.)
    location = /admin/login {
        limit_req zone=emystery_login burst=5 nodelay;
        proxy_pass http://emystery_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads are NOT on disk under public/ — this is belt-and-braces so a
    # stray file can never be served without going through admin auth.
    location /uploads/ { return 404; }

    # Long cache for fingerprint-free static assets is unsafe; keep it short.
    location /css/ {
        proxy_pass http://emystery_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        limit_req zone=emystery_general burst=50 nodelay;

        proxy_pass http://emystery_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # The app sets its own security headers (helmet); don't duplicate them.
        proxy_hide_header X-Powered-By;
    }
}


# Nginx vhost for IndiaOffers E-Mystery
# Domain: https://mystery.indiaoffers.in
#
# 1. Point DNS:  A  mystery.indiaoffers.in  →  your VPS IP
# 2. Copy this file to /etc/nginx/sites-available/mystery.indiaoffers.in
# 3. ln -s ... sites-enabled/
# 4. certbot --nginx -d mystery.indiaoffers.in
# 5. Run app: PORT=3100 NODE_ENV=production SITE_URL=https://mystery.indiaoffers.in ...

server {
    listen 80;
    listen [::]:80;
    server_name mystery.indiaoffers.in;

    # Uncomment after certbot, or let certbot manage SSL:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 8m;
    }
}


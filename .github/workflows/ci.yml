name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check every source file parses
        run: |
          for f in $(git ls-files 'src/**/*.js' 'scripts/*.js' 2>/dev/null); do
            node --check "$f"
          done

      - name: Check EJS templates compile
        run: |
          node -e "
            const ejs = require('ejs'), fs = require('fs'), path = require('path');
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e =>
              e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            let bad = 0;
            for (const f of walk('src/views').filter(f => f.endsWith('.ejs'))) {
              try { ejs.compile(fs.readFileSync(f, 'utf8'), { filename: f }); }
              catch (e) { console.error('✗', f, '\n ', e.message); bad++; }
            }
            if (bad) process.exit(1);
            console.log('All templates compile.');
          "

      - name: Seed database
        run: npm run seed
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-test-password-not-a-real-secret

      - name: Start server
        run: |
          PORT=3100 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3100/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3100/healthz || { cat server.log; exit 1; }

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh
        env:
          BASE: http://localhost:3100
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-test-password-not-a-real-secret

      - name: Verify a self-reported payment never reaches 'paid'
        run: |
          set -e
          LOC=$(curl -sS -i -X POST http://localhost:3100/book \
            -d 'plan_id=basic' --data-urlencode 'client_name=CI Fraud Check' \
            --data-urlencode "client_email=ci-$(date +%s)@example.com" \
            -d 'brand_url=https://ci.example.com' -d 'accept_cost_policy=1' \
            | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          CODE="${LOC#/pay/}"; CODE="${CODE%%\?*}"; TOK="${LOC##*t=}"
          curl -sS -o /dev/null -X POST "http://localhost:3100/pay/$CODE?t=$TOK" \
            -d "t=$TOK" -d 'payment_method=upi' -d 'payment_ref=000000000000'
          STATUS=$(node -e "
            const D=require('better-sqlite3');
            const db=new D('data/emystery.db',{readonly:true});
            const o=db.prepare('SELECT status,amount_paid,paid_at FROM mystery_orders WHERE order_code=?').get('$CODE');
            console.log(JSON.stringify(o)); db.close();
          ")
          echo "  order state: $STATUS"
          echo "$STATUS" | grep -q '"status":"payment_review"' \
            || { echo '✗ a made-up UTR moved the order out of review'; exit 1; }
          echo "$STATUS" | grep -q '"amount_paid":null' \
            || { echo '✗ unverified money was recorded as received'; exit 1; }
          echo "$STATUS" | grep -q '"paid_at":null' \
            || { echo '✗ unverified payment got a paid_at timestamp'; exit 1; }
          echo "✓ self-reported payment stays in review with no money recorded"

      - name: Verify production config guards reject unsafe settings
        run: |
          set -e
          expect_fail() {
            if env "$@" NODE_ENV=production node -e "require('./src/config')" 2>/dev/null; then
              echo "✗ production boot was allowed with: $*"; exit 1
            fi
            echo "✓ rejected: $*"
          }
          SAFE_SECRET=$(openssl rand -hex 32)
          expect_fail JWT_SECRET=short                             SITE_URL=https://example.com
          expect_fail JWT_SECRET=change-me-to-a-long-random-string SITE_URL=https://example.com
          expect_fail JWT_SECRET="$SAFE_SECRET"                    SITE_URL=http://example.com
          expect_fail JWT_SECRET="$SAFE_SECRET"                    SITE_URL=https://example.com MYSTERY_TEST_PAY=1
          env JWT_SECRET="$SAFE_SECRET" SITE_URL=https://example.com MYSTERY_TEST_PAY=0 \
            NODE_ENV=production node -e "require('./src/config')" >/dev/null
          echo "✓ accepted a correct production config"

      - name: Server log
        if: always()
        run: cat server.log || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Fail on known vulnerabilities in production deps
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no .env or database is committed
        run: |
          fail=0
          for pattern in '.env' 'data/*.db' '*.sqlite' 'data/uploads/*'; do
            if git ls-files --error-unmatch $pattern >/dev/null 2>&1; then
              echo "✗ tracked file matching '$pattern' — remove it from git"; fail=1
            fi
          done
          # .env.example is the only .env* file that belongs in the repo.
          for f in $(git ls-files '.env*'); do
            [ "$f" = ".env.example" ] || { echo "✗ $f must not be committed"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "✓ no secrets or data files tracked"
          exit $fail
